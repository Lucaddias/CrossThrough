# components.lock — origem fixa de tudo que entra no runtime do CrossThrough.
#
# Cada componente é open source. O build baixa a URL, confere o SHA-256 e falha
# se não bater. Para atualizar um componente, troque version/url/sha256 juntos.

# Fonte LGPL/MIT publicada pela CodeWeavers (https://www.codeweavers.com/crossover/source).
# Traz Wine 11.0 (com msync), gnutls+nettle+gmp, FreeType, MoltenVK, DXVK
# 1.10.3 para macOS, vkd3d, cabextract, GLib e GStreamer. Só o fonte aberto:
# nenhuma das partes proprietárias do CrossOver está neste tarball.
[crossover-sources]
version = 26.3.0
url = https://media.codeweavers.com/pub/crossover/source/crossover-sources-26.3.0.tar.gz
sha256 = ac99c8ca4b3848f3e81784135f023df266b61c2345726ea55a50b3e030dd6872
license = LGPL-2.1+ (Wine, vkd3d, gnutls, GLib, GStreamer), LGPL-3+/GPL-2+ (nettle, gmp), FTL/GPL-2 (FreeType), Apache-2.0 (MoltenVK), zlib (DXVK), GPL-2+/LGPL-2.1 (cabextract, libmspack)

# O tarball acima traz o nettle 3.10 sem o Makefile.in da raiz; usamos o
# lançamento oficial do GNU, mesma série 3.10 (compatível em ABI).
[nettle]
version = 3.10.2
url = https://ftp.gnu.org/gnu/nettle/nettle-3.10.2.tar.gz
sha256 = fe9ff51cb1f2abb5e65a6b8c10a92da0ab5ab6eaf26e7fc2b675c45f1fb519b5
license = LGPL-3+ ou GPL-2+

# O FreeType do tarball é uma cópia do git (sem configure, pede o submódulo
# dlg); usamos o lançamento oficial da mesma versão.
[freetype]
version = 2.13.3
url = https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz
sha256 = 0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289
license = FTL ou GPL-2

